version: 2
updates:
  # Single monthly update for all dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'staging'
    schedule:
      interval: 'monthly'
      time: '09:00'
    open-pull-requests-limit: 1
    reviewers:
      - '@dzikrisyairozi'
    assignees:
      - '@dzikrisyairozi'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'automated'
    # Group ALL updates into single PR
    groups:
      weekly-updates:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
          - 'major'
    # typescript-eslint 8.x hard-crashes on TypeScript >=7 (no config-level
    # workaround - see typescript-eslint/typescript-eslint#10940, #12518) and
