name: Release

# The only workflow that builds an image. A v* tag on main creates the
# GitHub Release, pushes the API image to GHCR and rolls it out to the VPS.
# CI is not re-run here: the staging -> main PR already ran it on this
# exact code.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release, publish & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse tags that are not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Derived from the repo name (lowercased, as GHCR requires), so a
      # project created from this template needs no edits here.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skipped until SSH_HOST / SSH_USER / SSH_KEY repo secrets exist
      # (the VPS needs /opt/<repo> with a docker-compose.yml and .env).
      - name: Deploy to VPS
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG
